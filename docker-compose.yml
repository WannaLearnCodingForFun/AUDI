# AUDI cloud deployment (upgrade 6.1): Postgres, S3-compatible image storage (MinIO), the cloud
# memory service, the maintenance portal API in cloud mode, Caddy (HTTPS), Prometheus + Grafana.
# Secrets come from .env (see docs/DEPLOY.md); nothing secret is committed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audi
      POSTGRES_USER: audi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U audi"], interval: 10s, retries: 10}
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes: [miniodata:/data]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set m http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
             mc mb -p m/audi-images; mc anonymous set none m/audi-images"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  cloud:
    build: {context: ., dockerfile: Dockerfile.cloud}
    environment:
      AUDI_CLOUD_DB_URL: postgresql+psycopg://audi:${POSTGRES_PASSWORD}@db:5432/audi
      AUDI_CLOUD_JWT_SECRET: ${AUDI_CLOUD_JWT_SECRET:?set in .env}
      AUDI_CLOUD_USER: ${AUDI_CLOUD_USER:-sync}
      AUDI_CLOUD_PASSWORD: ${AUDI_CLOUD_PASSWORD:?set in .env}
      AUDI_S3_BUCKET: audi-images
      AUDI_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      AUDI_CONFIG: /app/deploy/config.cloud.yaml
    volumes: [./deploy/config.cloud.yaml:/app/deploy/config.cloud.yaml:ro]
    depends_on: {db: {condition: service_healthy}, minio-init: {condition: service_completed_successfully}}
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      AUDI_CONFIG: /app/deploy/config.cloud.yaml
      AUDI_JWT_SECRET: ${AUDI_JWT_SECRET:?set in .env}
      AUDI_CLOUD_USER: ${AUDI_CLOUD_USER:-sync}
      AUDI_CLOUD_PASSWORD: ${AUDI_CLOUD_PASSWORD}
      AUDI_ADMIN_PASSWORD: ${AUDI_ADMIN_PASSWORD:?set in .env}
      AUDI_OPERATOR_PASSWORD: ${AUDI_OPERATOR_PASSWORD:?set in .env}
      AUDI_MAINTENANCE_PASSWORD: ${AUDI_MAINTENANCE_PASSWORD:?set in .env}
      AUDI_IMAGE_KEY: ${AUDI_IMAGE_KEY:?set in .env}
      AUDI_METRICS_TOKEN: ${AUDI_METRICS_TOKEN:?set in .env}
    volumes:
      - ./deploy/config.cloud.yaml:/app/deploy/config.cloud.yaml:ro
      - ./models:/app/models:ro
      - apidata:/app/data
    depends_on: [cloud]
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: Dockerfile.web}
    environment: {AUDI_DOMAIN: "${AUDI_DOMAIN:-localhost}"}
    ports: ["80:80", "443:443"]
    volumes: [caddydata:/data]
    depends_on: [api]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/metrics_token:/etc/prometheus/metrics_token:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped

volumes: {pgdata: {}, miniodata: {}, apidata: {}, caddydata: {}}
